---
# wikven으로 짓는 작은 소개 사이트.
#
# 저장소를 모르는 사람이 "그래서 이게 뭔데"를 읽는 자리다. 저장소의
# README.md는 고치는 사람이 보는 곳이고, 여기는 쓰는 사람이 보는 곳이다.
#
# 패치 열 개는 패치/0001처럼 한 쪽씩 따로 있고, 첫 화면의 "고친 것" 표는
# 그 쪽들에서 DPL이 만든다. 패치를 더할 때 표는 건드리지 않는다.

extensions:
  # 설치 페이지의 명령어 블록이 쓴다.
  - SyntaxHighlight_GeSHi
  # 첫 화면의 "고친 것" 표가 쓴다.
  - DynamicPageList4
  # 패치 문서 옆에 붙는 상자가 쓴다.
  - PortableInfobox
  # 정적 사이트가 달리 만들 수 없는 head 태그를 쓴다. 사이트 소유 증명과
  # 검색 결과에 뜨는 설명이다.
  - WikiSEO
  # WikiSEO가 각 문서의 첫 문단을 여기서 받아 설명으로 쓴다.
  - TextExtracts

skins:
  - MonoBook

config:
  Sitename: 카카오톡 on Wine
  # MonoBook으로 읽는다. 일부러 구식이다. 2004년 위키백과의 그것이고,
  # 이 프로젝트가 하는 일과 어울린다. 윈도우 메신저를 리눅스에서 돌리는
  # 일이다.
  DefaultSkin: monobook

  # wikven은 기본값으로 무엇을 적든 Vector를 같이 짓는다. 두 쪽짜리
  # 사이트가 안 보여줄 스킨 한 벌을 더 들고 다니게 되고, 구식으로 읽히는
  # 것이 요점인데 모든 문서에 Vector로 가는 전환기가 붙는다.
  #
  # 1.3.0이 끄는 길을 냈다. 2.0에서는 skins 목록이 기본값을 덮게 되므로
  # 이 설정은 폐기된다. 그때 Vector를 도로 원하면 skins에 직접 적으면
  # 된다. chaotic-ground/wikven#812.
  WikvenBuildVector: false

  # 사이트맵과 og:url처럼 사이트 밖에서 문서를 가리켜야 하는 것이 여기서
  # 나온다. 굽는 것 자체는 상대 경로라서 이 값과 무관하게 어디서나 돈다.
  WikvenSiteUrl: https://chaotic-ground.github.io/kakaotalk-on-wine/

  # Search Console에 이 사이트의 주인이 누구인지 증명한다. WikiSEO가 모든
  # 문서의 head에 meta 태그로 넣는다.
  #
  # 값은 자격 증명이 아니다. 주장 말고는 아무것도 주지 않고, 구글은 사이트의
  # 아무 문서나 받아본 사람에게 이 값을 그대로 돌려준다.
  #
  # 토큰이 속성이 아니라 계정에 묶여 있어서 chaotic-ground의 다른 사이트와
  # 같은 값이다. 파일로 증명하는 쪽은 속성마다 이름이 다르다.
  GoogleSiteVerificationKey: 2rzhjoB0M6oJLKFCyvqcW6_SGAkxpf7o4RIWOGfpfPY

  # 검색 결과에서 제목 밑에 뜨는 문장. 없으면 크롤러가 아무 데서나
  # 주워오고, 이런 문서에서는 대개 길잡이 조각이 걸린다. WikiSEO가
  # TextExtracts에 첫 문단을 물어 넣어주므로 문서마다 적지 않아도 된다.
  #
  # WikiSeoTryCleanAutoDescription은 일부러 안 켠다. 잘린 문장을 마지막
  # 마침표까지 되돌리라는 것인데, 이미 마침표로 끝나지 않을 때만 돌고
  # TextExtracts는 잘린 발췌를 "..."로 끝내서 영영 안 돈다. 대신 빈 발췌를
  # "."이라는 설명으로 만든다. 태그가 없느니만 못하다.
  WikiSeoEnableAutoDescription: true

  # 패치 쪽의 제목은 "패치/0007"이고 읽고 싶은 것은 무엇을 고쳤는지다.
  # DISPLAYTITLE이 진짜 제목과 다른 것을 쓰려면 이게 꺼져 있어야 한다.
  RestrictDisplayTitle: false

  # 문서마다 붙는 편집과 역사 링크가 GitHub으로 간다. 위키처럼 보이지만
  # 고치는 곳은 저장소다.
  WikvenEditUrl: https://github.com/chaotic-ground/kakaotalk-on-wine/edit/main/site/$1
  WikvenHistoryUrl: https://github.com/chaotic-ground/kakaotalk-on-wine/commits/main/site/$1

  # 둘 다 묶음에 없어서 빌드할 때 받아온다. 어느 쪽도 1.46 가지가 없으므로
  # main을 커밋으로 고정한다. MediaWiki를 올릴 때 여기가 먼저 깨진다.
  # reference는 git clone --branch로 가므로 SHA는 commit에 적는다.
  WikvenRepositories:
    DynamicPageList4:
      repository: https://github.com/Universal-Omega/DynamicPageList4.git
      commit: d2e8e6caa1bc2468c83cf5087d2bbfd660484883
    PortableInfobox:
      repository: https://github.com/Universal-Omega/PortableInfobox.git
      commit: 60c09a75d023eac1da3a63945d0a4a9678fc86db
    # REL1_46의 머리에 건다. v2.7.0 태그가 아닌 이유는 그 태그의 매니페스트가
    # 2.6.6에 MediaWiki 1.39 이상이라고 적혀 있어서다. 가지 쪽이 2.7.0에
    # 1.42 이상이다. 태그 이름이 담고 있지 않은 코드를 약속한다.
    WikiSEO:
      repository: https://github.com/wikimedia/mediawiki-extensions-WikiSEO.git
      commit: 358a3d4775c36d6a0044330416bb6be9b6463a12

# 한국어 카카오톡과, 그것이 필요로 하는 Wine.
#
# 앱 id는 GitHub 조직 이름의 하이픈 자리에 밑줄이 있다. flatpak id는 D-Bus
# 이름 규칙을 따르고 거기서는 요소 안에 하이픈을 못 쓴다.
#
# Wine은 여기서 컴파일하지 않고 빌드된 tarball로 온다. Wine의 PE 모듈에는
# 크로스 컴파일러가 필요한데 freedesktop SDK에는 mingw 확장이 없다. 그래서
# 빌드는 컨테이너에서 하고(patches/README.md), 결과를 릴리스 자산으로
# 올린다. 패치와 그것이 적용되는 업스트림 tarball이 둘 다 이 저장소에 있고,
# 그것이 저 바이너리를 설명 가능하게 만들며 Wine의 라이선스도 만족시킨다.
#
# 카카오톡 자체는 64비트지만 WoW64 빌드, 즉 32비트와 64비트 둘 다다.
# 설치 파일이 64비트가 아니기 때문이다. 카카오는 64비트 클라이언트를 32비트
# NSIS 설치 파일 안에 넣어 배포하고, 32비트 쪽이 없는 Wine은 여기서 멈춘다.
#
#   wine: failed to load L"C:\\windows\\syswow64\\ntdll.dll" error c0000135
#
# 카카오톡 자체는 여기 없고 있을 수도 없다. 카카오가 배포할 것이다. 런처가
# 첫 실행 때 설치 파일을 받아온다.
#
# 빌드하고, 릴리스에 올릴 번들까지 만들려면:
#
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#     build-dir io.github.chaotic_ground.KakaoTalk.yml
#   flatpak run org.flatpak.Builder --force-clean --repo=repo \
#     build-dir io.github.chaotic_ground.KakaoTalk.yml
#   flatpak build-bundle repo kakaotalk.flatpak io.github.chaotic_ground.KakaoTalk
#
# 한 번이 아니라 두 번 빌드하는 것이 함정이다. --install은 --repo에 쓰지
# 않고, --repo는 설치하지 않는다. 이전 빌드에서 남은 repo는 그 사실을
# 알려주지 않는다. build-bundle은 성공하고 지지난 버전 70메가를 돌려준다.
# 믿지 말고 나온 것을 확인하라.
#
#   grep -c <방금 넣은 것> build-dir/files/bin/kakaotalk
#
# patches/README.md에 적어둔 모듈 캐시와 같은 모양이다. flatpak-builder는
# 아무도 요청하지 않은 내용으로 기꺼이 성공한다.
app-id: io.github.chaotic_ground.KakaoTalk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: kakaotalk
# 여기서 만든 로캘을 앱 안에 둔다. 그냥 두면 flatpak-builder가 .Locale
# 확장으로 옮기는데, 번들은 확장을 담지 않으므로 배포되는 것은 아무것도
# 가리키지 않는 심볼릭 링크가 된다.
separate-locales: false

finish-args:
  - --socket=wayland
  # XWayland도 함께. Wine의 Wayland 드라이버는 실행 중에 정해지고,
  # 프리픽스에 X11을 쓰라고 할 수도 있다. WINE_GRAPHICS를 보라.
  - --socket=fallback-x11
  - --share=ipc
  # 이게 없으면 32비트 프로그램이 아예 안 돌고, 설치 파일이 그중 하나다.
  # flatpak의 seccomp 필터가 WoW64가 CPU를 32비트 모드로 넣을 때 쓰는 것을
  # 막아서, 32비트 PE는 시작하기도 전에 죽는다. wine은 그걸 start.exe의
  # "Application could not be started"로 보고하는데, 파일이 없다는 말처럼
  # 들리지만 그게 아니다.
  - --allow=multiarch
  - --allow=devel
  - --device=dri
  - --socket=pulseaudio
  # 첫 실행 때 설치 파일이 카카오 CDN에서 오고, 앱 자체가 메신저다.
  - --share=network
  # 파일을 주고받는 것이 이 앱의 상당 부분이다. $HOME 전체가 아니라 바로
  # 그 용도인 디렉터리 하나를 준다.
  - --filesystem=xdg-download
  # 파일 하나 때문이다. 런처가 설치된 클라이언트에서 꺼내 아이콘 테마가
  # 보는 자리에 쓰는 아이콘. 보통 앱처럼 /app/share에 둘 수 없는 이유는,
  # 거기는 아이콘을 꺼낼 클라이언트가 생기기 한참 전에 읽기 전용이 되기
  # 때문이다. Wine에서 받을 수도 없다. winewayland는 창 아이콘을
  # xdg-toplevel-icon-v1로 설정하는데 mutter가 그걸 구현하지 않았다.
  # 런처의 install_icon을 보라.
  - --filesystem=xdg-data/icons:create
  # 글꼴은 요청할 것이 없다. 호스트의 것은 묻지 않아도 /run/host/fonts로
  # 오고, 없으면 안 되는 두 face는 아래에 번들로 넣는다. /usr은 flatpak이
  # 예약해둔 곳이라 요청하면 실행할 때마다 큰 소리로 거부당한다.
  - --env=WINEDEBUG=-all
  # 런처가 아니라 여기서 정한다. 런처를 돌리는 셸이 처음부터 이걸 갖고
  # 시작하도록. 안에서 export하면 로캘이 wine에는 닿지만 bash는 이미 자기
  # 것을 정해버린 뒤라 실행할 때마다 불평한다.
  - --env=LOCPATH=/app/lib/locale

modules:
  # ko_KR.UTF-8을 앱 안에 빌드해 넣는다. 런타임의 Locale 확장은 호스트의
  # 언어만 담고, 앱별로 조절할 손잡이가 없다. extra-languages는 호스트의
  # 전역 설정인데, 그게 바로 이 패키지가 없애려는 의존이다. localedef도
  # ko_KR 원본도 SDK에 있다.
  - name: locale
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/locale
      - localedef --no-archive -i ko_KR -f UTF-8 /app/lib/locale/ko_KR.UTF-8
    sources: []

  - name: wine
    buildsystem: simple
    build-commands:
      - mkdir -p /app/wine
      - cp -a wine-11.18-emoji/. /app/wine/
    sources:
      - type: archive
        strip-components: 0
        url: https://github.com/chaotic-ground/kakaotalk-on-wine/releases/download/wine-11.18-emoji/wine-11.18-emoji-wow64-x86_64.tar.xz
        sha256: 32b90273844aecbd4af67a3d3c6f06f0426d7b2fca39e02d447c2dc8bd5132c9

  # 프리픽스가 없으면 안 되는 두 face. 호스트에서 가져오지 않고 번들로
  # 넣는다. 한국어 글꼴이 없는 프리픽스는 한글 글리프를 전부 네모로 그리고,
  # 이모지 face는 폰트 링크가 가리키는 대상이다.
  - name: fonts
    buildsystem: simple
    build-commands:
      - install -Dm644 NanumGothic.ttf /app/share/kakaotalk/fonts/NanumGothic.ttf
      - install -Dm644 NanumGothicBold.ttf /app/share/kakaotalk/fonts/NanumGothicBold.ttf
      - install -Dm644 NotoEmoji-Regular.ttf /app/share/kakaotalk/fonts/NotoEmoji-Regular.ttf
    sources:
      - type: file
        url: https://github.com/chaotic-ground/kakaotalk-on-wine/releases/download/wine-11.18-emoji/NanumGothic.ttf
        sha256: 31cf6994c8c022a086d8ac6f5662b5729d1cdbe26e6886eeeb43e59e89de05dd
      - type: file
        url: https://github.com/chaotic-ground/kakaotalk-on-wine/releases/download/wine-11.18-emoji/NanumGothicBold.ttf
        sha256: 9a83877e343381d01b0b39a83be28fa4ece1309e73583663feb656a3da2a0ad2
      - type: file
        url: https://github.com/chaotic-ground/kakaotalk-on-wine/releases/download/wine-11.18-emoji/NotoEmoji-Regular.ttf
        sha256: 4ac5d75ee7270e8dd76de58758bf0aae36fc56f1db3a1d41a41cd64b79265efa

  - name: kakaotalk
    buildsystem: simple
    build-commands:
      - install -Dm755 kakaotalk /app/bin/kakaotalk
      - install -Dm644 kakaotalk-korean.reg /app/share/kakaotalk/kakaotalk-korean.reg
      - install -Dm755 extract-icon.py /app/share/kakaotalk/extract-icon.py
      # 이름이 앱 id여야 한다. 아니면 flatpak이 내보내지 않는다.
      - install -Dm644 io.github.chaotic_ground.KakaoTalk.desktop
        /app/share/applications/io.github.chaotic_ground.KakaoTalk.desktop
      - install -Dm644 kakaoshow.exe /app/share/kakaotalk/kakaoshow.exe
    sources:
      - type: file
        path: kakaotalk
      # 나머지와 함께 컨테이너에서 빌드한다. SDK에는 PE 컴파일러가 없다.
      # 같이 릴리스에 올린다. 원본은 여기 flatpak/kakaoshow.c다.
      - type: file
        url: https://github.com/chaotic-ground/kakaotalk-on-wine/releases/download/wine-11.18-emoji/kakaoshow.exe
        sha256: 19a78a7e24e333531a1efadcb434f6926ad263e49d11dc9d5427a9a868569b34
      - type: file
        path: ../config/kakaotalk-korean.reg
      - type: file
        path: extract-icon.py
      - type: file
        path: io.github.chaotic_ground.KakaoTalk.desktop

---
# 이 저장소가 실제로 넘어진 자리를 규칙으로 적어둔 것.
#
# 린터는 옳고 그름을 모르는 일반 규칙을 봅니다. 여기 있는 것은 이 코드에만
# 해당하는 불변식이고, 셋 다 지키지 못해서 버그가 났던 것들입니다.
#
# 주석은 AST에 들어가지 않으므로 pattern-regex로 원문을 봅니다. opengrep이
# 그걸 할 수 있어서 쓰고 있습니다.
rules:
  - id: hide-outside-helper
    languages: [generic]
    severity: WARNING
    message: >-
      액터를 직접 숨기지 말고 _hideActor를 쓰세요. 추적되지 않은 hide()는
      disable()이 놓아주지 못합니다. 잘못 숨긴 창이 확장을 다시 읽어도
      숨겨진 채 남고, 셸은 showing이라 하는데 화면에는 없습니다.
    paths:
      include: ['impl.js']
    pattern-regex: 'get_compositor_private\(\)\??\.hide\(\)'

  - id: title-outside-classify
    languages: [generic]
    severity: WARNING
    message: >-
      창을 제목으로 판단하지 마세요. classify.js가 정합니다. 여섯 군데가
      제각기 답하다가 세 번 넘어졌습니다. 띠와 목록 창은 제목이 같습니다.
    paths:
      include: ['impl.js']
    pattern-regex: "get_title\\(\\) [!=]== '카카오톡'"

  - id: loader-version-from-clock
    languages: [generic]
    severity: WARNING
    message: >-
      동적 import의 질의 문자열에 시계를 쓰지 마세요. impl.js의 수정 시각이어야
      합니다. enable()마다 URL이 달라지면 모듈 캐시가 사본을 셸이 끝날 때까지
      들고 있고, 모듈 수준의 registerClass가 해제되지 않는 GType을 그만큼
      만듭니다. 열흘에 170벌이 쌓여 gnome-shell이 RSS 2.6GB까지 갔습니다.
    paths:
      include: ['extension.js']
    pattern-regex: '\?v=\$\{(Date\.now|GLib\.get_(real|monotonic)_time)'

  - id: long-comment-block
    languages: [generic]
    severity: INFO
    message: >-
      연속된 주석이 20줄을 넘습니다. 주석이 아니라 문서일 수 있고, 그렇다면
      자리는 gnome/README.md입니다. impl.js의 머리말 55줄이 그랬습니다.
      잰 숫자와 해봤는데 안 된 것들은 여기 두는 게 맞습니다.
    paths:
      include: ['*.js']
    pattern-regex: '(?m)^(?:[ \t]*//[^\n]*\n){20,}'

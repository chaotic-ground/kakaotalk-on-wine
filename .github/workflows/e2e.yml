---
name: E2E

# 화면 없는 GNOME Shell에 확장을 올리고, 창이 실제로 화면에 남아 있는지
# 본다. 단위 시험이 못 잡는 것이 있어서다. classify가 창을 list라고 옳게
# 답해도 그 뒤에 액터를 숨기면 화면에서는 사라지고, 실제로 그렇게 났다.
#
# 진짜 카카오톡은 쓸 수 없다. 카카오 설치 파일을 받아야 하고 로그인이
# 필요하다. 확장이 창에 대해 보는 것은 wm_class와 제목과 크기뿐이고,
# mutter는 Wayland 클라이언트의 app_id를 wm_class로 돌려준다. 그래서
# app_id만 맞춘 가짜 창으로 충분하다.
on:
  push:
    branches: [main]
    paths:
      - 'gnome/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'gnome/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 이미지를 캐시에서 만든다. gnome-shell은 apt로 수백 MB라 매번 받으면
      # 시험보다 설치가 오래 걸린다. 레지스트리에 밀지 않고 러너 안에만
      # 올린다. 캐시 키는 Dockerfile이다.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build the test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: gnome/kakaotalk-popup@lens0021/test/e2e
          load: true
          tags: kakaotalk-e2e
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,mode=max,scope=e2e-image

      # 컴포지터를 띄우는 시험은 소켓과 타이밍에 기댄다. 세 번까지 다시
      # 해본다. 세 번 다 떨어지면 그것은 흔들림이 아니라 고장이다.
      - name: Run it
        run: |
          for attempt in 1 2 3; do
            echo "::group::시도 $attempt"
            if docker run --rm -v "$PWD:/repo:ro" kakaotalk-e2e \
                 /repo/gnome/kakaotalk-popup@lens0021/test/e2e/run.sh; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "시도 $attempt 실패"
            sleep 5
          done
          echo "::error::세 번 다 실패했습니다"
          exit 1

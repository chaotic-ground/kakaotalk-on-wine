---
name: Wine

# patches/가 바뀌면 Wine을 다시 빌드한다. patches/README.md에 손으로 하는
# 절차가 있고 이것은 같은 절차를 러너에 옮긴 것이다. 러너는 코어가 적어
# 두어 시간 걸린다.
#
# 두 배포판에서 빌드한다. 한쪽에만 있는 헤더나 기본값에 기대기 시작하면
# 다른 쪽에서 조용히 기능이 빠진 Wine이 나오는데, 그것은 빌드가 끝나고
# 한참 뒤에나 드러난다. 배포되는 tarball은 Fedora 쪽이다. 개발하는 기계가
# 그것이고 지금까지 올라간 것도 그렇게 지어졌다.
#
# 올리는 것은 따로다. 매니페스트가 tarball을 체크섬으로 묶고 있어서, 자산을
# 바꾸는 것과 매니페스트를 고치는 것은 같이 가야 한다. 그래서 push에서는
# 빌드만 해서 아티팩트로 두고, publish를 켜고 손으로 돌릴 때만 릴리스
# 자산을 바꾸고 새 sha256을 요약에 적는다.
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/wine.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 릴리스 자산까지 바꾼다
        type: boolean
        default: false

permissions: {}

env:
  WINE_VERSION: '11.18'
  # 자산이 사는 릴리스이자 prefix 디렉터리 이름. tarball 안의 최상위
  # 디렉터리가 이 이름이고 매니페스트가 그 이름으로 복사한다.
  RELEASE: wine-11.18-emoji
  WINE_SHA256: c6282f6d4daecf11f3ab9f9a2b6c598f67be7e28c363ba2cae8a3c44b611e7a4

jobs:
  build:
    name: ${{ matrix.base }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 300
    # 컨테이너 안에서는 기본 셸이 sh다. 우분투의 sh는 dash라
    # set -o pipefail을 모른다. 페도라의 sh는 bash라서 그냥
    # 지나갔다.
    defaults:
      run:
        shell: bash
    permissions:
      contents: write  # gh release upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: dnf
            image: fedora:43
            publishes: true
          # 26.04가 아니다. 거기서는 apt-get build-dep wine이 풀리지
          # 않는다. 우분투의 wine 10.0 소스가 unicode-cldr-core (< 47)을
          # 요구하는데 26.04에는 그보다 새것만 있다.
          - base: apt
            image: ubuntu:24.04
            publishes: false
    steps:
      # 컨테이너가 비어 있다. checkout은 git이 없으면 조용히 REST로
      # 내려받고, gh는 자산을 읽고 쓸 때 쓴다.
      - name: Install the tools the runner assumes (dnf)
        if: matrix.base == 'dnf'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git-core gh tar xz file

      - name: Install the tools the runner assumes (apt)
        if: matrix.base == 'apt'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl file git gh tar xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 클라이언트는 64비트지만 두 아키텍처를 다 빌드한다. 카카오가 32비트
      # NSIS 설치 파일 안에 넣어 배포해서, 32비트 쪽이 없는 Wine은
      # syswow64\ntdll.dll을 못 읽고 멈춘다. 새 WoW64는 32비트 PE
      # 컴파일러를 필요로 하고 32비트 호스트 라이브러리는 필요로 하지
      # 않는다. mingw만 있고 다른 것은 없는 이유다.
      #
      # 0006이 Wayland 드라이버를 시스템 libpng에 건다. 배포판이 주는
      # wine의 빌드 의존성에는 없으므로 양쪽 다 따로 적는다.
      - name: Install the build dependencies (dnf)
        if: matrix.base == 'dnf'
        run: |
          dnf install -y dnf5-plugins
          dnf builddep -y wine
          dnf install -y mingw32-gcc mingw64-gcc libpng-devel

      - name: Install the build dependencies (apt)
        if: matrix.base == 'apt'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get build-dep -y wine
          apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 libpng-dev

      - name: Fetch the source
        run: |
          curl -fsSLO \
            "https://dl.winehq.org/wine/source/11.x/wine-$WINE_VERSION.tar.xz"
          echo "$WINE_SHA256  wine-$WINE_VERSION.tar.xz" | sha256sum -c -
          tar -xf "wine-$WINE_VERSION.tar.xz"

      # git apply는 저장소를 원한다. 빌드 디렉터리가 이 안에 생기므로 여기에
      # 커밋할 생각은 하지 말 것. patches/README.md를 보라.
      - name: Apply the patches
        run: |
          cd "wine-$WINE_VERSION"
          git init -q .
          git apply -v "$GITHUB_WORKSPACE"/patches/0*.patch

      # configure는 없는 라이브러리를 보고 멈추지 않는다. 그 기능이 빠진
      # Wine을 지을 뿐이다. 배포판을 두 개 두는 이유가 여기에 있고, 그
      # 차이는 빌드가 아니라 쓰다가 드러난다. 빠지면 안 되는 것들은 여기서
      # 떨어뜨린다.
      - name: Configure
        run: |
          set -o pipefail
          mkdir -p "wine-$WINE_VERSION/build"
          cd "wine-$WINE_VERSION/build"
          ../configure --enable-archs=i386,x86_64 \
            --prefix="$GITHUB_WORKSPACE/$RELEASE" 2>&1 | tee configure.log
          if grep 'not found' configure.log |
             grep -E 'wayland|xkbcommon|png|freetype|fontconfig|gnutls|vulkan'
          then
            echo '::error::없으면 안 되는 라이브러리가 빠졌다. 위를 보라.'
            exit 1
          fi

      - name: Build
        run: |
          cd "wine-$WINE_VERSION/build"
          make -j"$(nproc)"
          make install

      # 위의 configure 검사를 빠져나가는 길이 있을 수 있다. 나온 것을 본다.
      # unix 쪽은 64비트 하나뿐이다. 새 WoW64에서 32비트는 PE로만 나오고
      # i386-unix는 아예 없다. patches/README.md의 32비트 이야기가 그것이다.
      - name: Check the driver came out
        run: |
          test -f "$RELEASE/lib/wine/x86_64-unix/winewayland.so"
          test -f "$RELEASE/lib/wine/x86_64-windows/winewayland.drv"
          test -f "$RELEASE/lib/wine/i386-windows/winewayland.drv"

      # 안 하면 1.7GB, 하면 499MB다. PE 모듈은 자기 아키텍처의 strip으로
      # 해야 한다.
      - name: Strip
        run: |
          find "$RELEASE/lib/wine/x86_64-windows" -type f \
            -exec x86_64-w64-mingw32-strip {} +
          find "$RELEASE/lib/wine/i386-windows" -type f \
            -exec i686-w64-mingw32-strip {} +
          # bin/ 에는 ELF가 아닌 것도 있다. winegcc 같은 셸 스크립트와
          # function_grep.pl이다. strip에 그것들을 같이 넘기면 단계가
          # 통째로 떨어진다.
          find "$RELEASE/bin" "$RELEASE/lib/wine/x86_64-unix" -type f \
            -exec sh -c '
              for f; do
                case $(file -b --mime-type "$f") in
                  application/x-*executable|application/x-sharedlib)
                    strip "$f" ;;
                esac
              done
            ' _ {} +

      # import 라이브러리와 헤더는 Wine으로 빌드할 때 쓰는 것이지 실행할 때
      # 쓰는 것이 아니다. 499MB와 배포되는 379MB의 차이가 이것이다.
      - name: Drop what only a build needs
        run: |
          rm -rf "$RELEASE/include"
          find "$RELEASE/lib/wine" -name '*.a' -delete
          du -sh "$RELEASE"

      - name: Pack
        env:
          XZ_OPT: '-T0'
        run: |
          tar -cJf "$RELEASE-wow64-x86_64.tar.xz" "$RELEASE"
          ls -l "$RELEASE-wow64-x86_64.tar.xz"

      # 이 문단을 믿지 말고 이미 올라간 tarball과 비교하라고 README가
      # 말한다. 여기서도 같이 한다. 빠지거나 늘어난 파일은 strip이나
      # 버리는 단계가 어긋났다는 뜻이고, 두 배포판 사이의 차이도 여기서
      # 보인다. Wine 버전이 올라갈 때는 당연히 다르므로 멈추지는 않는다.
      - name: Compare with what is published
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh는 저장소 이름을 git에게 묻는데, 컨테이너 안에서는
          # 체크아웃한 디렉터리의 주인이 달라 git이 거절한다.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE" \
            -p "$RELEASE-wow64-x86_64.tar.xz" -D published
          diff \
            <(tar -tf "published/$RELEASE-wow64-x86_64.tar.xz" \
              | sed 's#/$##' | sort) \
            <(find "$RELEASE" | sort) \
            || echo '파일 목록이 다르다. 위를 보라.'

      - name: Say what came out
        run: |
          sha256sum "$RELEASE-wow64-x86_64.tar.xz" |
            tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: wine-${{ matrix.base }}
          path: ${{ env.RELEASE }}-wow64-x86_64.tar.xz
          retention-days: 7

      # 매니페스트의 sha256도 같이 고쳐야 설치되는 것이 바뀐다. 위 요약에
      # 적힌 값이다.
      - name: Replace the release asset
        if: inputs.publish && matrix.publishes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE" "$RELEASE-wow64-x86_64.tar.xz" --clobber
